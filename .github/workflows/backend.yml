name: Backend tests

on:
  push:
    paths:
      - "Web/Backend/**"
      - "ML/Model/**"
      - "ML/Data/Processing/*.py"
      - "config/grid_norms.json"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "Web/Backend/**"
      - "ML/Model/**"
      - "ML/Data/Processing/*.py"
      - "config/grid_norms.json"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Web/Backend/requirements.txt
      - run: python -m pip install -r Web/Backend/requirements.txt
      - run: python -m unittest discover -s Web/Backend/tests
